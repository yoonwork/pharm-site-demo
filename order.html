<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>의약품 주문 시스템 (예시)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#121a26;font-family:Pretendard,sans-serif;padding:24px;box-sizing:border-box;word-break:keep-all}div{max-width:440px;text-align:center}h1{font-size:24px;margin:0 0 10px}p{color:#4a5568;line-height:1.6}button{margin-top:12px;height:48px;padding:0 22px;border-radius:999px;border:1px solid #121a26;background:#fff;font:inherit;font-weight:800;cursor:pointer}</style></head>
<body><div><h1>기존 의약품 주문 시스템 자리</h1><p>실제 사이트에서는 이 새 창에 귀사가 지금 쓰시는 주문 시스템이 열려요.<br>주소는 관리자 화면의 '홈페이지 내용 수정'에서 바꿀 수 있어요.</p><button onclick="window.close()">창 닫기</button></div></body></html>
