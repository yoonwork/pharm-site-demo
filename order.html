<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>의약품 주문 시스템 (예시)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F3EF;color:#14181F;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;padding:24px 16px;word-break:keep-all}main{max-width:460px;width:100%;background:#fff;border-radius:28px;padding:36px 28px;text-align:center}.tag{display:inline-flex;height:26px;align-items:center;padding:0 10px;border-radius:999px;background:#F6D365;font-size:12px;font-weight:700}h1{font-size:26px;letter-spacing:-.04em;line-height:1.3;margin:16px 0 10px}p{color:#454D59;line-height:1.65;margin:0}button{margin-top:24px;width:100%;height:52px;border-radius:999px;border:0;background:#14181F;color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:transform .12s}button:active{transform:scale(.97)}</style></head>
<body><main><span class="tag">제안용 데모 · 예시</span><h1>기존 의약품 주문 시스템 자리</h1><p>실제 사이트에서는 이 새 창에 귀사가 지금 쓰시는 주문 시스템이 열려요.<br>주소는 관리자 화면의 '홈페이지 내용 수정'에서 바꿀 수 있어요.</p><button type="button" onclick="window.close()">창 닫기</button></main></body></html>
